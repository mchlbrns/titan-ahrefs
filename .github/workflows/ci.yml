name: titan-ahrefs CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate AI Context & Governance Docs
        run: |
          test -f workspace.json
          test -f AGENTS.md
          test -f AI_CONTEXT.md
          test -f README.md
          test -f IMPLEMENTATION_PLAN.md
          echo "All governance and AI context files validated."
